<svg viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg" width="900" height="220" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>

    <!-- Background gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#020B12"/>
      <stop offset="50%"  stop-color="#040D18"/>
      <stop offset="100%" stop-color="#06101E"/>
    </linearGradient>

    <!-- Holographic shimmer gradient (animates) -->
    <linearGradient id="holo" x1="0%" y1="0%" x2="100%" y2="0%" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#00FFD1"/>
      <stop offset="25%"  stop-color="#8B5CF6"/>
      <stop offset="50%"  stop-color="#FF2D6B"/>
      <stop offset="75%"  stop-color="#00FFD1"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
      <animateTransform attributeName="gradientTransform" type="translate"
        values="-900 0; 900 0; -900 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- Glow filter for name -->
    <filter id="glow" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Subtle glow for tagline -->
    <filter id="soft-glow" x="-10%" y="-60%" width="120%" height="220%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Scan line pattern -->
    <pattern id="scanlines" x="0" y="0" width="2" height="4" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="2" height="1" fill="rgba(0,255,209,0.03)"/>
    </pattern>

    <!-- Grid pattern -->
    <pattern id="grid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(0,255,209,0.06)" stroke-width="0.5"/>
    </pattern>

    <!-- Left accent gradient -->
    <linearGradient id="accent-left" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FFD1" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00FFD1" stop-opacity="0"/>
    </linearGradient>

    <!-- Right accent gradient -->
    <linearGradient id="accent-right" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </linearGradient>

    <!-- Corner glow -->
    <radialGradient id="corner-glow-tl" cx="0%" cy="0%" r="60%">
      <stop offset="0%"   stop-color="#00FFD1" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#00FFD1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="corner-glow-br" cx="100%" cy="100%" r="60%">
      <stop offset="0%"   stop-color="#8B5CF6" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="center-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#FF2D6B" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#FF2D6B" stop-opacity="0"/>
    </radialGradient>

  </defs>

  <!-- Base background -->
  <rect width="900" height="220" fill="url(#bg)"/>

  <!-- Corner glows -->
  <rect width="900" height="220" fill="url(#corner-glow-tl)"/>
  <rect width="900" height="220" fill="url(#corner-glow-br)"/>
  <rect width="900" height="220" fill="url(#center-glow)"/>

  <!-- Grid layer -->
  <rect width="900" height="220" fill="url(#grid)"/>

  <!-- Scanlines -->
  <rect width="900" height="220" fill="url(#scanlines)"/>

  <!-- Left accent bar -->
  <rect x="0" y="0" width="180" height="2" fill="url(#accent-left)"/>
  <rect x="0" y="218" width="180" height="2" fill="url(#accent-left)"/>

  <!-- Right accent bar -->
  <rect x="720" y="0" width="180" height="2" fill="url(#accent-right)"/>
  <rect x="720" y="218" width="180" height="2" fill="url(#accent-right)"/>

  <!-- Top border pulse -->
  <rect x="0" y="0" width="900" height="1.5" fill="url(#holo)" opacity="0.7"/>
  <!-- Bottom border pulse -->
  <rect x="0" y="218.5" width="900" height="1.5" fill="url(#holo)" opacity="0.7"/>

  <!-- Data stream particles left -->
  <g opacity="0.5">
    <rect x="30" y="0" width="1" height="60" fill="#00FFD1" opacity="0.6">
      <animateTransform attributeName="transform" type="translate" values="0,-60; 0,280" dur="3.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="60" y="0" width="1" height="40" fill="#8B5CF6" opacity="0.5">
      <animateTransform attributeName="transform" type="translate" values="0,-40; 0,260" dur="4.1s" begin="-1.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="15" y="0" width="1" height="30" fill="#FF2D6B" opacity="0.4">
      <animateTransform attributeName="transform" type="translate" values="0,-30; 0,250" dur="2.8s" begin="-0.8s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Data stream particles right -->
  <g opacity="0.5">
    <rect x="840" y="0" width="1" height="50" fill="#8B5CF6" opacity="0.6">
      <animateTransform attributeName="transform" type="translate" values="0,-50; 0,270" dur="3.5s" begin="-1s" repeatCount="indefinite"/>
    </rect>
    <rect x="870" y="0" width="1" height="35" fill="#00FFD1" opacity="0.5">
      <animateTransform attributeName="transform" type="translate" values="0,-35; 0,255" dur="4.4s" begin="-2s" repeatCount="indefinite"/>
    </rect>
    <rect x="855" y="0" width="1" height="45" fill="#FF2D6B" opacity="0.4">
      <animateTransform attributeName="transform" type="translate" values="0,-45; 0,265" dur="3.0s" begin="-0.3s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Corner brackets TL -->
  <path d="M 18 18 L 18 38 M 18 18 L 38 18" stroke="#00FFD1" stroke-width="1.5" fill="none" opacity="0.8"/>
  <!-- Corner brackets TR -->
  <path d="M 882 18 L 882 38 M 882 18 L 862 18" stroke="#8B5CF6" stroke-width="1.5" fill="none" opacity="0.8"/>
  <!-- Corner brackets BL -->
  <path d="M 18 202 L 18 182 M 18 202 L 38 202" stroke="#8B5CF6" stroke-width="1.5" fill="none" opacity="0.8"/>
  <!-- Corner brackets BR -->
  <path d="M 882 202 L 882 182 M 882 202 L 862 202" stroke="#00FFD1" stroke-width="1.5" fill="none" opacity="0.8"/>

  <!-- System label top-left -->
  <text x="48" y="32" font-family="'Courier New', monospace" font-size="8" fill="#00FFD1" opacity="0.55" letter-spacing="2">SYS::PROFILE_LOADED</text>

  <!-- System label top-right -->
  <text x="852" y="32" font-family="'Courier New', monospace" font-size="8" fill="#8B5CF6" opacity="0.55" letter-spacing="2" text-anchor="end">ZA::CAPE_TOWN</text>

  <!-- Tag line above name -->
  <text x="450" y="74" font-family="'Courier New', monospace" font-size="11" fill="#00FFD1"
        text-anchor="middle" letter-spacing="6" opacity="0.7" filter="url(#soft-glow)">ASPIRING DATA ENGINEER</text>

  <!-- Main name — holographic fill -->
  <text x="450" y="138"
        font-family="'Courier New', monospace"
        font-weight="bold"
        font-size="58"
        fill="url(#holo)"
        text-anchor="middle"
        letter-spacing="4"
        filter="url(#glow)">GULIAN IBRAHIM</text>

  <!-- Name shadow/depth layer -->
  <text x="452" y="140"
        font-family="'Courier New', monospace"
        font-weight="bold"
        font-size="58"
        fill="none"
        stroke="#00FFD1"
        stroke-width="0.3"
        text-anchor="middle"
        letter-spacing="4"
        opacity="0.25">GULIAN IBRAHIM</text>

  <!-- Tagline below name -->
  <text x="450" y="168" font-family="'Courier New', monospace" font-size="12"
        fill="#C8D8E8" text-anchor="middle" letter-spacing="3" opacity="0.65">C# · Python · SQL · Data Engineering</text>

  <!-- Bottom status line -->
  <text x="48" y="206" font-family="'Courier New', monospace" font-size="8"
        fill="#8B5CF6" opacity="0.5" letter-spacing="1.5">BSc Computing @ STADIO · Golden Key Member · HackIT 2026 #124</text>

  <!-- Bottom right pulse dot -->
  <circle cx="868" cy="200" r="3" fill="#00FFD1" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.2;0.8" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="860" y="204" font-family="'Courier New', monospace" font-size="8"
        fill="#00FFD1" opacity="0.5" text-anchor="end" letter-spacing="1">ONLINE</text>

  <!-- Horizontal centre divider lines -->
  <line x1="80" y1="148" x2="250" y2="148" stroke="url(#accent-left)" stroke-width="0.5" opacity="0.4"/>
  <line x1="650" y1="148" x2="820" y2="148" stroke="url(#accent-right)" stroke-width="0.5" opacity="0.4"/>

</svg>
